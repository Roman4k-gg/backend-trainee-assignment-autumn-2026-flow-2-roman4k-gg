openapi: 3.0.3
info:
  title: Avito.Kitchen API
  version: 1.0.0
  description: MVP API для сервиса доставки еды Авито.Кухня
paths:
  /api/v1/restaurants:
    get:
      summary: Получить список доступных ресторанов
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
  /api/v1/restaurants/{id}/menu:
    get:
      summary: Получить меню ресторана
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Меню ресторана
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
  /api/v1/orders:
    post:
      summary: Создать заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /api/v1/orders/{id}:
    get:
      summary: Получить статус заказа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Информация о заказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /api/v1/orders/{id}/items:
    get:
      summary: Получить список позиций заказа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Позиции заказа
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
  /api/v1/orders/{id}/status:
    patch:
      summary: Обновить статус заказа (вызывается рестораном)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [CREATED, ACCEPTED, PREPARING, DELIVERING, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Статус обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

components:
  schemas:
    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        webhook_url:
          type: string
        created_at:
          type: string
          format: date-time
    MenuItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        is_available:
          type: boolean
    OrderRequest:
      type: object
      required:
        - user_id
        - restaurant_id
        - items
      properties:
        user_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required:
              - menu_item_id
              - quantity
            properties:
              menu_item_id:
                type: string
                format: uuid
              quantity:
                type: integer
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        status:
          type: string
        total_amount:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price_at_order:
          type: integer
