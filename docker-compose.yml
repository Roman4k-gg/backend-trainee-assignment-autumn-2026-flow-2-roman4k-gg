version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: avito_kitchen_db
    environment:
      POSTGRES_USER: kitchen_user
      POSTGRES_PASSWORD: kitchen_password
      POSTGRES_DB: avito_kitchen
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/000002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_user -d avito_kitchen"]
      interval: 5s
      timeout: 5s
      retries: 5

  kitchen-api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: avito_kitchen_api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://kitchen_user:kitchen_password@db:5432/avito_kitchen?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  mock-restaurant:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: avito_mock_restaurant
    ports:
      - "8081:8081"
    environment:
      KITCHEN_API_URL: "http://kitchen-api:8080"
    depends_on:
      - kitchen-api

volumes:
  pgdata:
